---

- name: Ensure Network/DNS is up before /srv/cvmfs mounts on Freiburg Stratum 0
  hosts: cvmfs-stratum0.galaxyproject.eu
  tasks:
    - name: Read current gateway-ping-timeout for enp1s0
      ansible.builtin.command: nmcli -g connection.gateway-ping-timeout connection show enp1s0
      register: __nm_gw_ping
      changed_when: false

    - name: Make NM wait for the gateway to answer before declaring enp1s0 up
      ansible.builtin.command: nmcli connection modify enp1s0 connection.gateway-ping-timeout 30
      when: __nm_gw_ping.stdout | trim != "30"
  tags: system

- name: CVMFS Servers
  hosts: cvmfs_stratum0_servers:cvmfs_stratum1_servers
  roles:
    # see squid-foreground comments in host_vars/cvmfs1-psu0
    #- role: galaxyproject.general.copy
    #  tags: general
    - role: galaxyproject.general.firewall
      when: ansible_kernel_version != "BrandZ virtual linux"
      tags: general
    - role: galaxyproject.cvmfs
      tags: cvmfs
    - role: galaxyproject.general.systemd
      tags: systemd
  post_tasks:
    - name: Mask setroubleshootd
      ansible.builtin.systemd_service:
        name: setroubleshootd.service
        masked: true
  tags: cvmfs

- name: CVMFS SSL Servers
  hosts: cvmfs_ssl_servers
  roles:
    - role: usegalaxy_org.cvmfs_ssl
  tags:
    - cvmfs
    - cvmfs_ssl

- name: Tailnet
  hosts: cvmfs_stratum0_servers:cvmfs_stratum1_servers
  roles:
    - role: artis3n.tailscale
      when: "'galaxy_tailnet_hosts' in group_names"
  tags: tailscale
