---

- name: Galaxy Nodes
  hosts: galaxy_nodes
  pre_tasks:
    # Not sure why this is set but it breaks LDAP
    - name: Ensure invalid ldap_tls_cacertdir is not set in /etc/sssd/sssd.conf
      ansible.builtin.lineinfile:
        path: /etc/sssd/sssd.conf
        regexp: "^ldap_tls_cacertdir = /etc/openldap/cacerts$"
        state: absent
      notify:
        - Restart sssd
    # /etc/resolv.conf is created by cloud-jnit but is not updated when the DNS servers are changed in openstack.
    # 99-cloud-init.conf contains only `dns = none` so removing it allows NM to update DNS servers.
    - name: Remove /etc/NetworkManager/conf.d/99-cloud-init.conf
      ansible.builtin.file:
        path: /etc/NetworkManager/conf.d/99-cloud-init.conf
        state: absent
      notify:
        - Restart NetworkManager
    - name: Flush handlers
      meta: flush_handlers
  roles:
    - role: galaxyproject.general.packages
    - role: galaxyproject.general.paths
    - role: galaxyproject.cvmfs
    - role: galaxyproject.slurm
      tags: slurm
    - role: galaxyproject.general.copy
      tags: copy
    - role: galaxyproject.general.cron
    - role: tc_limit
  post_tasks:
    - name: Ensure /var/lib/slurm is publicly accessible
      ansible.builtin.file:
        path: /var/lib/slurm
        state: directory
        mode: "0755"
  handlers:
    - name: Restart sssd
      ansible.builtin.systemd:
        name: sssd
        state: restarted
    - name: Restart NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted
