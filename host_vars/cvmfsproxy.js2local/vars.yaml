---

os_image: Featured-RockyLinux9
# m3.small (2 vCPU) was CPU-bound: one squid process at ~95% of a core capped the whole cluster at ~200 MB/s and every
# request (hit or miss) took ~0.6-1 s for a 3 MB chunk.
os_flavor: m3.medium
os_key_name: nate-treehouse
os_auto_ip: false
os_boot_from_volume: true
os_terminate_volume: true
os_volume_size: 64
os_security_groups:
  - default
  - usegalaxy-control
openstack_wait_timeout: 300

# Cache volume: ~1.2 TB of unique data.galaxyproject.org objects are fetched per day (18 TB total), so the cache should
# hold at least that. The volume name is matched by the openstack role, changing it would create a new volume.
os_volumes:
  - name: "{{ inventory_hostname_short }}-cache"
    size: 2048
    fstype: xfs

# The boot volume is sda, so the cache volume should be sdb when it is first formatted, check with lsblk after attaching
# it. It is mounted by label so that a different device name at boot doesn't matter.
filesystems:
  - dev: /dev/sdb
    fstype: xfs
    opts: -L cvmfs-cache

# this is parallel with os_volumes and filesystems
host_mounts:
  - path: /var/cache/cvmfs-proxy
    src: LABEL=cvmfs-cache
    fstype: "{{ os_volumes[0].fstype }}"
    # Don't hang the boot if the volume is missing, but don't start nginx without it either (it would fill the root
    # volume)
    opts: defaults,nofail,x-systemd.before=nginx.service,x-systemd.required-by=nginx.service
    # nginx creates (and owns) its cache dir under the mount point, the nginx user does not exist yet when this is
    # mounted on a new instance
    owner: root
    group: root
    mode: "0755"

cvmfs_nginx_proxy_cache_dir: /var/cache/cvmfs-proxy/cache
cvmfs_nginx_proxy_cache_max_size: 1900g
cvmfs_nginx_proxy_cache_min_free: 50g

# Fetch from Apache on cvmfs1-iu0 directly, for both of its names:
# - Port 80 there is a single-worker squid in front of Apache on 8008. It runs at ~76-95% of a core, serves only ~1% of
#   bytes from its cache, and adds ~100-400 ms per 3 MB chunk under load (3-15 ms from Apache directly).
# - Clients mostly ask for cvmfs1-iu0.galaxyproject.org, which would connect to the stratum 1's public floating IP,
#   hairpinning through the Neutron router and SNAT. The js2local name keeps the traffic on the private network.
# Port 8008 is not opened by the cvmfs security group (only 22, 80 and 3128 are), reaching it relies on the `default`
# security group that both hosts are in, which is not managed here.
cvmfs_nginx_proxy_upstream_servers:
  cvmfs1-iu0.galaxyproject.org: cvmfs1-iu0.js2local:8008
  cvmfs1-iu0.js2local: cvmfs1-iu0.js2local:8008
