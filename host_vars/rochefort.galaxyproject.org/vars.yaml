---

host_authorized_key_users: "{{ vault_host_authorized_key_users }}"
host_private_key_users: "{{ vault_host_private_key_users }}"

# legacy mounts are used for these two datasets to ensure proper mounting order
host_mounts:
  - src: data/rochefort/depot
    path: /srv/nginx/depot.galaxyproject.org/root
    fstype: zfs
    state: mounted
    backup: yes
    owner: depot
    group: depot
  - src: orval.galaxyproject.org:/data/orval/depot/singularity
    path: /srv/nginx/depot.galaxyproject.org/root/singularity
    fstype: nfs
    state: mounted
    backup: yes
    owner: singularity
    group: singularity

# uids and gids were auto-generated on old rochefort (except nate's) which is the
# reason for the uid/gid mess

# TODO: unify with galaxyproject_users
host_users:
  - name: sites
    uid: 1000
    gid: 2049
    group: sites
    comment: 'Web sites'
  - name: bioarchive
    uid: 2049
    gid: 2050
    group: bioarchive
    comment: 'bioaRchive'
  - name: depot
    uid: 2052
    gid: 2053
    group: depot
    comment: 'Galaxy Depot'
  - name: zfsdump-rochefort
    uid: 2051
    gid: 2052
    group: zfsdump-rochefort
    comment: 'ZFS send rochefort'
    home: /home/zfsdump-rochefort
    shell: /bin/bash
  - name: singularity
    uid: 161
    gid: 161
    group: singularity
    home: /home/singularity
    shell: /bin/bash
  - name: training
    uid: 2055
    gid: 2055
    group: training
    home: /home/training
    shell: /bin/bash
  - name: starforge
    uid: 2056
    gid: 2056
    group: starforge
    home: /home/starforge
    shell: /bin/bash

zfs_filesystems:
  - name: data/rochefort/snpeff-data
    mountpoint: /srv/nginx/snpeff-data.galaxyproject.org/root
    exec: "off"
    setuid: "off"
    owner: root
    group: root
  - name: data/rochefort/bioarchive
    mountpoint: /srv/nginx/bioarchive.galaxyproject.org/root
    exec: "off"
    setuid: "off"
    owner: bioarchive
    group: bioarchive
  - name: data/rochefort/images
    mountpoint: /srv/nginx/images.galaxyproject.org/root
    exec: "off"
    setuid: "off"
    owner: sites
    group: sites
  - name: data/rochefort/sample-data
    mountpoint: /srv/nginx/sample-data.galaxyproject.org/root
    exec: "off"
    setuid: "off"
    owner: sites
    group: sites
  - name: data/rochefort/wheels
    mountpoint: /srv/nginx/wheels.galaxyproject.org/root
    exec: "off"
    setuid: "off"
    owner: sites
    group: sites
  - name: data/rochefort/screencast
    mountpoint: /srv/nginx/screencast.galaxyproject.org/root
    exec: "off"
    setuid: "off"
    owner: sites
    group: sites
  - name: data/rochefort/depot
    mountpoint: legacy
    exec: "off"
    setuid: "off"
    owner: depot
    group: depot
  - name: data/rochefort/eggs
    mountpoint: /srv/nginx/eggs.galaxyproject.org/root
    exec: "off"
    setuid: "off"
    owner: sites
    group: sites
  - name: data/rochefort/depot/singularity
    mountpoint: legacy
    exec: "off"
    setuid: "off"
    owner: singularity
    group: singularity

host_directories:
  - path: /srv/nginx/depot.galaxyproject.org/root/training
    owner: training
    group: training
  - path: /srv/nginx/depot.galaxyproject.org/root/starforge
    owner: starforge
    group: starforge
  - path: /srv/nginx/depot.galaxyproject.org/root/starforge/travis
    owner: starforge
    group: starforge

host_templates:
  - dest: /etc/rsyncd.conf
    src: ini.j2
    contents:
      software:
        path: /srv/nginx/depot.galaxyproject.org/root/software
        comment: Community Package Cache
        use chroot: 'yes'
        uid: 'nobody'
        gid: 'nogroup'
        read only: 'yes'
        list: 'yes'
        dont compress: '*.tgz *.zip *.gz *.bz2 *.bam *.2bit *.lzo'
      singularity:
        path: /srv/nginx/depot.galaxyproject.org/root/singularity
        comment: BioContainers Singularity Images
        use chroot: 'yes'
        uid: 'nobody'
        gid: 'nogroup'
        read only: 'yes'
        list: 'yes'
        dont compress: '*.tgz *.zip *.gz *.bz2 *.bam *.2bit *.lzo'

host_service_configurations:
  - src: files/smf/rsyncd.xml

# FIXME: manually set before starting nfs/mapid:
# sharectl set -p nfsmapid_domain=galaxyproject.org nfs
host_services:
  - name: network/rsyncd
    state: started
    enabled: 'yes'
  - name: svc:/network/rpc/bind
    state: started
    enabled: true
  - name: svc:/network/nfs/mapid
    state: started
    enabled: true

zfs_admin_permissions:
  - name: data/rochefort/snpeff-data
    users: zfsdump-rochefort
    permissions: send,snapshot,hold
  - name: data/rochefort/bioarchive
    users: zfsdump-rochefort
    permissions: send,snapshot,hold
  - name: data/rochefort/images
    users: zfsdump-rochefort
    permissions: send,snapshot,hold
  - name: data/rochefort/sample-data
    users: zfsdump-rochefort
    permissions: send,snapshot,hold
  - name: data/rochefort/eggs
    users: zfsdump-rochefort
    permissions: send,snapshot,hold
  - name: data/rochefort/wheels
    users: zfsdump-rochefort
    permissions: send,snapshot,hold
  - name: data/rochefort/screencast
    users: zfsdump-rochefort
    permissions: send,snapshot,hold
  - name: data/rochefort/depot
    users: zfsdump-rochefort
    permissions: send,snapshot,hold

# template for zfs backup cron jobs: prepend with "dataset='<dataset>' && backupserver='<server>'"
#zfs_backup_job_template: last_snap_file=".last_snap_`echo $dataset | tr / ,`" && [ -f ~/${last_snap_file} ] && last_snapdate=`cat ~/${last_snap_file}` || true && snapdate=`date -u +\%Y\%m\%dT\%H\%M\%SZ` && zfs snapshot ${dataset}@${snapdate} && [ -z "${last_snapdate}" ] && zfs send ${dataset}@${snapdate} | ssh -T ${backupserver} || zfs send -i ${last_snapdate} ${dataset}@${snapdate} | ssh -T ${backupserver} && echo $snapdate >~/${last_snap_file}

