---

- name: Tasks for Jetstream2 persistent hosts
  hosts: jetstream2_persistent_hosts
  roles:
    - role: ceph_mount
      tags: paths
    - role: galaxyproject.general.copy
      tags: copy
    - role: galaxyproject.general.cron
      tags: cron
    - role: galaxyproject.general.services
      tags: services
  post_tasks:
    - name: Disable SELinux
      ansible.posix.selinux:
        state: disabled
    - name: Remove packages
      ansible.builtin.dnf:
        name: "{{ jetstream2_packages_absent }}"
        state: absent
    - name: Remove yum repo files
      ansible.builtin.file:
        path: "/etc/yum.repos.d/{{ item }}"
        state: absent
      loop: "{{ jetstream2_yum_repo_files_absent }}"
    - name: Remove /software mount
      ansible.posix.mount:
        path: /software
        state: absent
    - name: Remove profile scripts
      ansible.builtin.file:
        path: "/etc/profile.d/{{ item }}"
        state: absent
      loop:
        - z99-lmod-default-modules.sh
        # calls out to the Jetstream2 status page on every login
        - 99-js2status.sh
  tags: [initial, system]

- name: CVMFS tasks
  hosts: jetstream2_persistent_hosts
  roles:
    - role: galaxyproject.cvmfs
    - role: galaxyproject.general.systemd
  tags: cvmfs

- name: CVMFS local proxy nginx
  hosts: cvmfs_local_proxies
  roles:
    - role: galaxyproject.nginx
  tags: nginx

# This has to be last for slurm elastic (everything must be configured/done when slurmd starts)
- name: Tasks for slurm hosts
  hosts: jetstream2_persistent_hosts
  tasks:
    - ansible.builtin.import_role:
        name: galaxyproject.slurm
    - name: Fix /var/spool/slurm perms
      ansible.builtin.file:
        path: /var/spool/slurm
        owner: slurm
        group: slurm
        mode: 0755
    - name: Copy Slurm scripts
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
      loop: "{{ slurm_script_files | default([]) }}"
    - name: Template Slurm scripts
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
      loop: "{{ slurm_script_templates | default([]) }}"
    - name: Install slurm-drmaa
      ansible.builtin.dnf:
        name: "{{ slurm_drmaa_rpm_url }}"
        disable_gpg_check: true
      when: inventory_hostname in groups.jetstream2_pulsar_servers
  tags: slurm

- name: Slurmscale
  hosts: jetstream2_controllers
  roles:
    - role: slurmscale
  tags: slurmscale
